<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Update</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background-color:#1F8A5B;color:#ffffff;padding:22px 24px;text-align:center;font-size:22px;font-weight:bold;line-height:1.3;">
              Course Update — {{{INSTITUTION_NAME}}}
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 30px;color:#333333;font-size:16px;line-height:1.6;">
              <!-- Admin message (any language). Pass HTML with <br> for line breaks. -->
              <div style="margin:0 0 8px;white-space:pre-wrap;">{{{MESSAGE}}}</div>

              <div style="background-color:#f8f9fa;border-left:4px solid #1F8A5B;padding:12px 15px;margin:20px 0;font-size:15px;color:#334155;">
                If you have questions, reply to this email.<br />
                Website:
                <a href="https://{{{DOMAIN_NAME}}}" style="color:#1F8A5B;font-weight:bold;text-decoration:none;" target="_blank">
                  {{{DOMAIN_NAME}}}
                </a>
              </div>

              <p style="margin:0;">
                Best regards,<br />
                <strong>{{{INSTITUTION_NAME}}} Team</strong>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f4f4f7;text-align:center;padding:15px;font-size:12px;color:#777777;">
              &copy; {{{YEAR}}} {{{INSTITUTION_NAME}}}. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
