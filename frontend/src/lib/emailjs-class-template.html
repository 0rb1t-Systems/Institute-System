<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Course Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .email-header {
            background-color: #0d6efd;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .email-body {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }
        .message-content {
            white-space: pre-wrap;
            margin: 0 0 8px;
        }
        .contact-box {
            background-color: #f8f9fa;
            border-left: 4px solid #0d6efd;
            padding: 12px 15px;
            margin: 20px 0;
            font-size: 15px;
        }
        .website-link {
            display: inline-block;
            margin-top: 10px;
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
        .email-footer {
            background-color: #f4f4f7;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="email-container">
        <div class="email-header">
            Course Update - {{institution_name}}
        </div>

        <div class="email-body">
            <!-- Admin-written message (any language), personalized per student -->
            <div class="message-content">{{message}}</div>

            <div class="contact-box">
                If you have questions, contact us at: <br>
                📞 <strong>0614554731</strong> / <strong>06133536526</strong><br>
                🌐 Website: <a href="https://{{domain_name}}" class="website-link" target="_blank">{{domain_name}}</a>
            </div>

            <p>Best regards,<br>
            <strong>{{institution_name}} Team</strong></p>
        </div>

        <div class="email-footer">
            &copy; 2026 {{institution_name}}. All rights reserved.
        </div>
    </div>

</body>
</html>
